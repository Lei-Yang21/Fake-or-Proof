<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Prediction History</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: bisque;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      font-size: 28px;
    }
    ul {
      list-style-type: none;
      padding: 0;
      text-align: left;
    }
    li {
      margin: 10px 0;
      font-size: 18px;
    }
    p {
      font-size: 18px;
      margin-bottom: 30px;
    }
    .button {
      text-decoration: none;
      padding: 12px 25px;
      border-radius: 6px;
      background-color: #0066cc;
      color: #fff;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }
    .button:hover {
      background-color: #005bb5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Prediction History</h2>
    {% if history %}
      <ul>
        {% for item in history %}
          <li>
            <strong>{{ item.filename }}</strong> → {{ item.prediction }}
            <br>
            <small>{{ item.timestamp }}</small>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p>No predictions yet.</p>
    {% endif %}
    <a href="/" class="button">Back to Home</a>
  </div>
</body>
</html>
