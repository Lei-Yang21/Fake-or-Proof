<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Fake Or Proof</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: bisque;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 28px;
    }
    p {
      font-size: 18px;
      margin-bottom: 20px;
    }
    form {
      margin: 20px 0;
    }
    input[type="file"] {
      margin-bottom: 20px;
    }
    button, .button {
      text-decoration: none;
      padding: 12px 25px;
      border-radius: 6px;
      background-color: #0066cc;
      color: #fff;
      font-size: 16px;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover, .button:hover {
      background-color: #005bb5;
    }
    .button {
      display: inline-block;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fake Or Proof</h1>
    <p>Upload an image to check its authenticity.</p>
    <form action="/predict" method="post" enctype="multipart/form-data">
      <input type="file" name="image" required><br>
      <button type="submit">Predict</button>
    </form>
    <a href="/history" class="button">View Prediction History</a>
  </div>
</body>
</html>
