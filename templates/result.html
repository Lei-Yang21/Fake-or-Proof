<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Prediction Result</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: bisque;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 500px;
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 28px;
    }
    p {
      font-size: 18px;
      margin: 10px 0;
    }
    .buttons {
      margin-top: 30px;
    }
    .button {
      text-decoration: none;
      padding: 12px 25px;
      margin: 0 10px;
      border-radius: 6px;
      background-color: #0066cc;
      color: #fff;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }
    .button:hover {
      background-color: #005bb5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Prediction Result</h1>
    <p><strong>File :</strong> {{ filename }}</p>
    <p><strong>Prediction :</strong> {{ label }}</p>
    <p>
      <strong>Confidence :</strong>
      <span style="color: {{ confidence_color }};">{{ confidence }}</span>
    </p>
    <div class="buttons">
      <a href="/" class="button">Try Another Image</a>
      <a href="/history" class="button">View History</a>
    </div>
  </div>
</body>
</html>
