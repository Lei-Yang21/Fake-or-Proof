[project]
name = "fake-or-proof"
version = "0.1.0"
description = "Experimental AI image classifier deployed on Google Cloud Run"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.15.0",
    "torchvision==0.29.2",
    "numpy==2.5.4",
    "Pillow==13.0.0",
]

[dependency-groups]
app = ["streamlit==1.67.0", "torchcam==0.5.0"]
cloud = ["google-cloud-storage==3.17.1"]
pipeline = [
    {include-group = "cloud"},
    "matplotlib==3.11.2",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "kfp==2.18.0",
    "google-cloud-aiplatform==2.7.0",
]
test = ["pytest==9.2.0", "pip-audit==2.10.1"]

[tool.uv]
package = false
default-groups = ["app"]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'", "sys_platform == 'darwin'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform != 'darwin'"}]
torchvision = [{index = "pytorch-cpu", marker = "sys_platform != 'darwin'"}]

[tool.pytest.ini_options]
testpaths = [".github/tests"]
markers = ["integration: explicitly enabled cloud checks (none required for the demo)"]

